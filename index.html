<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agence de Protection des Animaux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Agence de Protection des Animaux</h1>
    <p>Nous œuvrons chaque jour pour défendre la vie sauvage.</p>
</header>

<section class="hero">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/49/Koala_climbing_tree.jpg" 
         alt="Koala">
</section>

<section class="contact-container">
    <h2>Contactez-nous</h2>

    <form action="#" method="POST" class="contact-form">
        <label for="name">Nom :</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Envoyer</button>
    </form>
</section>

<footer>
    <p>© 2025 Agence de Protection des Animaux – Ensemble, protégeons la nature.</p>
</footer>

<script>document.addEventListener('DOMContentLoaded', () => {
    // 1. REMPLACEZ CETTE CHAÎNE PAR VOTRE URL OBTENUE
    const API_URL = 'https://xe917wtm2h.execute-api.eu-west-1.amazonaws.com/prod/messages'; 

    const form = document.getElementById('contact-form');
    
    if (form) {
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Empêche l'envoi traditionnel du formulaire

            // Récupérer les valeurs des champs du formulaire
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
                // Assurez-vous que les IDs des champs (name, email, message)
                // correspondent bien à ceux de votre HTML.
            };

            // Envoyer les données à l'API Gateway (méthode POST)
            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur réseau ou réponse de l\'API non OK');
                }
                return response.json();
            })
            .then(data => {
                console.log('Succès:', data);
                alert('Merci ! Votre message a été envoyé avec succès.');
                form.reset(); // Vider le formulaire
            })
            .catch((error) => {
                console.error('Erreur lors de l\'envoi:', error);
                alert('Une erreur est survenue lors de l\'envoi du message.');
            });
        });
    }
});</script>

</body>
</html>
